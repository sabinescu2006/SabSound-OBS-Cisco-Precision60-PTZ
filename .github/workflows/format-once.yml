name: One-time clang-format repair
on:
  push:
    paths:
      - '.github/workflows/format-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format src/plugin.cpp with clang-format 19
        shell: bash
        run: |
          set -e
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet obsproject/tools/clang-format@19
          /home/linuxbrew/.linuxbrew/opt/clang-format@19/bin/clang-format-19 -i src/plugin.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/plugin.cpp; then
            git add src/plugin.cpp
            git commit -m "Apply clang-format 19 to PTZ plugin"
            git push
          fi
